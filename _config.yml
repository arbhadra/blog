title: Manish Bhadra Arnab
tagline: Writings, tutorials, and notes
description: >-
  Personal blog of Manish Bhadra Arnab — achievements, sample writings, and tutorials.
author: Manish Bhadra Arnab

baseurl: "/blog"
url: "https://arbhadra.github.io"

email: your.email@university.edu
social:
  google_scholar: "#"
  linkedin: "#"
  orcid: "#"
  github: "https://github.com/arbhadra"

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from   # keeps old /YYYY/MM/DD/title/ links working

excerpt_separator: "<!--more-->"
reading_speed: 200

# Every page inside posts/ uses the post layout, so uploaded post files
# need only an empty front matter block (two lines of ---) at the top.
defaults:
  - scope:
      path: "posts"
    values:
      layout: post

exclude:
  - docs
  - scripts
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
